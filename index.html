<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SparkAdmin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#07070b;color:#f5f5f7;min-height:100vh}button,input,select{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0,#24104d 0,#0b0912 38%,#07070b 70%)}.card{width:min(430px,100%);background:#101017;border:1px solid #272735;border-radius:24px;padding:34px;box-shadow:0 25px 80px #0008}.logo{font-weight:900;font-size:30px}.logo span{color:#9b6cff}.sub{color:#9b9baa;margin:7px 0 28px}.field{margin:14px 0}.field label{display:block;color:#b7b6c4;font-size:13px;margin-bottom:7px}.field input,.control{width:100%;background:#09090e;color:#fff;border:1px solid #2c2c39;border-radius:12px;padding:13px;outline:none}.primary{width:100%;border:0;border-radius:12px;padding:13px;margin-top:10px;background:linear-gradient(135deg,#8d5cff,#c15cff);color:white;font-weight:800;cursor:pointer}.primary:disabled{opacity:.6}.error{color:#ff6b7d;font-size:13px;min-height:20px;margin-top:10px}.app{display:flex;min-height:100vh}.side{width:245px;border-right:1px solid #22222c;background:#0c0c11;padding:22px;position:fixed;inset:0 auto 0 0}.nav{margin-top:34px;color:#8e8d99;font-size:13px}.nav div{padding:11px 12px;border-radius:10px;background:#17151f;color:#fff}.main{margin-left:245px;width:calc(100% - 245px);padding:32px}.top{display:flex;justify-content:space-between;align-items:center}.badge,.pill{font-size:12px;padding:7px 10px;border-radius:999px;background:#231744;color:#c9adff}.logout,.small{border:1px solid #2d2d38;background:#111118;color:#ddd;border-radius:10px;padding:9px 13px;cursor:pointer}.welcome{margin:35px 0}.welcome h1{font-size:34px;margin:0 0 8px}.muted{color:#8f8e9a}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.stat,.panel{background:#101017;border:1px solid #252530;border-radius:18px;padding:20px}.stat strong{display:block;font-size:28px;margin-top:7px}.panel{margin-top:18px}.panel h2{font-size:18px;margin:0 0 18px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:13px 8px;border-bottom:1px solid #24242d;font-size:14px}.table th{color:#858490;font-size:12px}.danger{border-color:#612635;color:#ff8c9d}.status{color:#8de6b5}.notice{margin-top:12px;color:#8f8e9a;font-size:12px}.empty{text-align:center;color:#777;padding:20px}@media(max-width:800px){.side{width:190px}.main{margin-left:190px;width:calc(100% - 190px);padding:20px}.grid{grid-template-columns:1fr}.table{min-width:760px}.panel{overflow:auto}}
</style>
</head>
<body>
<section id="login" class="login"><div class="card"><div class="logo">Spark<span>Admin</span></div><div class="sub">Secure SparkAgent administration</div><div class="field"><label>Username</label><input id="username" autocomplete="username" placeholder="Enter username"></div><div class="field"><label>Passcode</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter passcode" onkeydown="if(event.key==='Enter')login()"></div><button id="loginBtn" class="primary" onclick="login()">Sign in</button><div id="error" class="error"></div></div></section>
<section id="app" class="app hidden"><aside class="side"><div class="logo">Spark<span>Admin</span></div><div class="nav"><div>Dashboard</div></div><div class="notice">SparkAgent admin control center.</div></aside><main class="main"><div class="top"><span class="badge" id="roleBadge"></span><button class="logout" onclick="logout()">Log out</button></div><div class="welcome"><h1 id="welcome"></h1><div class="muted">Accounts, tiers, bans and login activity.</div></div><div class="grid"><div class="stat"><span class="muted">Accounts</span><strong id="userCount">0</strong></div><div class="stat"><span class="muted">Free accounts</span><strong id="freeCount">0</strong></div><div class="stat"><span class="muted">Banned</span><strong id="bannedCount">0</strong></div></div><div class="panel"><h2>Agent users</h2><table class="table"><thead><tr><th>User</th><th>Email</th><th>Tier</th><th>Status</th><th>Last login</th><th>Actions</th></tr></thead><tbody id="users"></tbody></table></div><div class="panel"><h2>Recent login activity</h2><table class="table"><thead><tr><th>User</th><th>Login time</th><th>Browser</th></tr></thead><tbody id="activity"></tbody></table></div></main></section>
<script>
const SUPABASE_URL='https://nzaelikbjumaidaombmp.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im56YWVsaWtianVtYWlkYW9tYm1wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxNDExOTEsImV4cCI6MjEwNDcxNzE5MX0.oepwqjQBGXSyrnvrxcnP9_YJ4erOBh3etFq7tPlx3-s';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let admin=null,token=sessionStorage.getItem('spark_admin_token');
const $=id=>document.getElementById(id);
async function rpc(name,args){const {data,error}=await sb.rpc(name,args);if(error)throw error;return data}
async function login(){
 $('error').textContent='';const username=$('username').value.trim();const password=$('password').value;
 if(!username||!password){$('error').textContent='Enter username and passcode.';return}
 $('loginBtn').disabled=true;$('loginBtn').textContent='Signing in...';
 try{const r=await rpc('admin_login',{p_username:username,p_password:password});if(!r?.success)throw new Error(r?.error||'Invalid username or passcode.');token=r.token;sessionStorage.setItem('spark_admin_token',token);admin={username:r.username,role:r.role};showApp()}catch(e){$('error').textContent=e.message||'Sign in failed.'}finally{$('loginBtn').disabled=false;$('loginBtn').textContent='Sign in'}
}
function showApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('welcome').textContent=`Welcome ${admin.role==='OWNER'?'Owner':'Manager'} — ${admin.username}`;$('roleBadge').textContent=admin.role;refresh()}
async function refresh(){try{const r=await rpc('admin_dashboard',{p_token:token});if(!r?.success)throw new Error(r?.error||'Session expired.');const users=r.users||[],logs=r.activity||[];$('userCount').textContent=users.length;$('freeCount').textContent=users.filter(x=>x.tier==='FREE').length;$('bannedCount').textContent=users.filter(x=>x.banned).length;$('users').innerHTML=users.length?users.map(x=>`<tr><td><strong>${esc(x.display_name||'User')}</strong></td><td>${esc(x.email||'—')}</td><td><select class="control" style="width:auto;padding:7px 9px" onchange="setTier('${x.id}',this.value)">${['FREE','PLUS','PRO','PREMIUM'].map(t=>`<option value="${t}" ${x.tier===t?'selected':''}>${t}</option>`).join('')}</select></td><td class="${x.banned?'':'status'}">${x.banned?'BANNED':'ACTIVE'}</td><td>${x.last_login_at?new Date(x.last_login_at).toLocaleString():'Never'}</td><td><button class="small danger" onclick="setBan('${x.id}',${!x.banned})">${x.banned?'Unban':'Ban'}</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">No accounts yet.</td></tr>';$('activity').innerHTML=logs.length?logs.map(l=>`<tr><td>${esc(l.display_name||l.email||l.user_id||'Unknown')}</td><td>${new Date(l.logged_in_at).toLocaleString()}</td><td>${esc(l.user_agent||'—')}</td></tr>`).join(''):'<tr><td colspan="3" class="empty">No login activity recorded yet.</td></tr>'}catch(e){if(/session|expired/i.test(e.message||''))logout();else $('users').innerHTML=`<tr><td colspan="6" class="empty">${esc(e.message)}</td></tr>`}}
async function setTier(id,tier){try{const r=await rpc('admin_set_tier',{p_token:token,p_target_user_id:id,p_tier:tier});if(!r?.success)throw new Error(r?.error||'Could not change tier.');refresh()}catch(e){alert(e.message)}}
async function setBan(id,banned){try{const r=await rpc('admin_set_banned',{p_token:token,p_target_user_id:id,p_banned:banned});if(!r?.success)throw new Error(r?.error||'Could not change ban.');refresh()}catch(e){alert(e.message)}}
function logout(){sessionStorage.removeItem('spark_admin_token');token=null;admin=null;location.reload()}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
(async()=>{if(!token)return;try{const r=await rpc('admin_session',{p_token:token});if(r?.success){admin={username:r.username,role:r.role};showApp()}else sessionStorage.removeItem('spark_admin_token')}catch{sessionStorage.removeItem('spark_admin_token')}})();
</script></body></html>
